[workspace]
name = "firewatch-head-tracking"
version = "0.0.0"
description = "Head tracking mod for Firewatch with aim decoupling"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
sync = "git submodule update --remote cameraunlock-core"
setup-melonloader = "powershell -ExecutionPolicy Bypass -File scripts/setup-libs.ps1"
# Unity reference stubs, compiled from the shared sources in the core submodule.
# net35 means pre-2017.3 Unity, so no UnityEngine.InputLegacyModule is produced -
# Input lives in UnityEngine.dll on the Unity 2017 build Firewatch ships. The
# csproj also references the game assembly, so Assembly-CSharp joins the empty
# module set: the mod reaches every game type through reflection and needs the
# name to resolve, not its contents.
setup = { cmd = 'powershell -ExecutionPolicy Bypass -Command "& cameraunlock-core/csharp/stubs/build-unity-stubs.ps1 -OutputPath src/FirewatchHeadTracking/libs -TargetFramework net35 -EmptyModule UnityEngine.CoreModule,UnityEngine.IMGUIModule,UnityEngine.UIModule,UnityEngine.TextRenderingModule,UnityEngine.AnimationModule,UnityEngine.PhysicsModule,Assembly-CSharp"', depends-on = ["setup-melonloader"] }
restore = { cmd = "dotnet restore src/FirewatchHeadTracking/FirewatchHeadTracking.csproj", depends-on = ["setup"] }
build = { cmd = "dotnet build src/FirewatchHeadTracking/FirewatchHeadTracking.csproj -c Release", depends-on = ["restore"] }
# Checks that every member reference the build emits resolves against the
# assemblies it binds to at runtime. Stub/engine shape drift (a property
# declared as a field, or the reverse) compiles cleanly and only fails in
# game. Needs the game installed; skips and succeeds without it.
verify-refs = { cmd = "powershell -ExecutionPolicy Bypass -File cameraunlock-core/scripts/verify-assembly-refs.ps1 -GameId firewatch -BuildDir src/FirewatchHeadTracking/bin/Release", depends-on = ["build"] }
# Bump vendored mod-loader copies to latest upstream within pinned range.
# Manual; commit the result. CI does not run this.
update-deps = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1"
install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1 Release", depends-on = ["build"] }
uninstall = "scripts\\uninstall.cmd"
package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["build"] }
clean = "dotnet clean src/FirewatchHeadTracking/FirewatchHeadTracking.csproj"
release = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1"

# Local helper: validate release readiness without running the release.
validate-release = "powershell -ExecutionPolicy Bypass -File scripts/validate-release.ps1"
